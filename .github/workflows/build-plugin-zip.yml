name: Build QGIS Plugin ZIP

on:
  push:
    branches: [main]
    paths-ignore:
      - 'OpenTopography-Point-Elevation.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build QGIS installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package OpenTopography-Point-Elevation.zip
          mkdir -p package/opentopography_point_elevation
          cp __init__.py api.py metadata.txt plugin.py processing_algorithm.py processing_provider.py icon.png README.md CREDITS.md LICENSE package/opentopography_point_elevation/
          cd package
          zip -r ../OpenTopography-Point-Elevation.zip opentopography_point_elevation
          cd ..
          unzip -t OpenTopography-Point-Elevation.zip
          test "$(unzip -Z1 OpenTopography-Point-Elevation.zip | head -n 1)" = "opentopography_point_elevation/"

      - name: Commit refreshed ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OpenTopography-Point-Elevation.zip
          if git diff --cached --quiet; then
            echo 'ZIP is already up to date.'
            exit 0
          fi
          git commit -m 'Build installable QGIS plugin ZIP'
          git push
